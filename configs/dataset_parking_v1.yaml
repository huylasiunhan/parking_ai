# Dataset configuration for Parking AI (Ultralytics / YOLO format)
# Reference: docs/03_DATASET_SPEC.md

path: datasets/parking_v1  # dataset root dir (relative to execution cwd)
train: images/train        # train images
val: images/val            # val images
test: images/test          # test images

# Number of classes
nc: 2

# Classes
names:
  0: space-empty
  1: space-occupied
