# Dataset configuration for Parking AI (Ultralytics / YOLO format)
# Reference: docs/03_DATASET_SPEC.md

path: datasets/parking_v1  # dataset root dir
train: images/train        # train images (relative to 'path')
val: images/val            # val images (relative to 'path')
test: images/test          # test images (relative to 'path')

# Classes
names:
  0: car
  1: truck
  2: bus
  3: motorcycle
