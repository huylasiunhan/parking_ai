[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"


[project]
name = "parking-ai"
version = "0.1.0"
description = "Smart Parking Vision System with Computer Vision, Self-Supervised Learning, and Backend Engineering"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

authors = [
    { name = "Phung Quoc Huy" }
]

dependencies = [
    # Core
    "numpy>=2.1,<3.0",
    "pillow>=10.4,<12.0",
    "pyyaml>=6.0",

    # Computer Vision
    "opencv-python>=4.10,<5.0",

    # Configuration
    "pydantic-settings>=2.6,<3.0",
]


[project.optional-dependencies]

# Machine Learning / Computer Vision
ml = [
    "torch>=2.6,<3.0",
    "torchvision>=0.21,<1.0",
    "ultralytics>=8.3,<9.0",
    "scikit-learn>=1.6,<2.0",
    "matplotlib>=3.9,<4.0",
    "tqdm>=4.67,<5.0",
]

# Backend
backend = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "email-validator>=2.2,<3.0",
]

# Development / Testing
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]

# Install everything needed for the full project
all = [
    "torch>=2.6,<3.0",
    "torchvision>=0.21,<1.0",
    "ultralytics>=8.3,<9.0",
    "scikit-learn>=1.6,<2.0",
    "matplotlib>=3.9,<4.0",
    "tqdm>=4.67,<5.0",

    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "email-validator>=2.2,<3.0",

    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
]


[project.scripts]
parking-ai = "app.main:main"


[tool.setuptools.packages.find]
include = [
    "app*",
    "ml*",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"


[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
